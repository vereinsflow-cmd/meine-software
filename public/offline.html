<!doctype html>
<!--
  Offline-Seite der App-Ansicht. Der Service Worker (public/sw.js) legt sie bei der Installation ab und zeigt sie, wenn
  eine Seite ohne Netz nicht geladen werden kann. Bewusst ohne Skript (die Content-Security-Policy ließe keins zu) und
  ohne nachgeladene Dateien: Stile, Logo und Symbol stehen in dieser Datei, damit alles auch ohne Verbindung da ist.
  Farben wie in src/app/globals.css, das Logo aus dem Logo-Paket (03-software/public/brand/logo.svg, im dunklen Modus
  die Farben von logo-weiss.svg), Aufbau wie die Seite „Nicht gefunden“. Nach jeder Änderung OFFLINE_REVISION in
  public/sw.js anpassen (tests/unit/service-worker.test.ts nennt den neuen Wert) – sonst behalten installierte Geräte
  die alte Fassung.
-->
<html lang="de">

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
    <title>Keine Verbindung · VereinsFlow</title>
    <style>
      :root {
        --background: oklch(0.972 0.005 258);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --muted-foreground: oklch(0.5 0 0);
        --primary: oklch(0.47 0.17 258);
        --primary-foreground: oklch(0.985 0 0);
        --ring: oklch(0.47 0.17 258);
        /* Logo-Farben aus dem Logo-Paket: hell wie logo.svg, dunkel wie logo-weiss.svg */
        --logo-ink: #1a1a1a;
        --logo-blue: #3a6bea;
        --logo-accent: #ff8a5e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.15 0.02 258);
          --foreground: oklch(0.985 0 0);
          --card: oklch(0.215 0.026 258);
          --muted-foreground: oklch(0.75 0.015 258);
          --primary: oklch(0.72 0.14 258);
          --primary-foreground: oklch(0.17 0.03 258);
          --ring: oklch(0.72 0.14 258);
          --logo-ink: #ffffff;
          --logo-blue: #8fb0ff;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      /* Sichere Bereiche: nichts unter Kamera-Aussparung, Statusleiste oder Home-Indikator (im Browser sind sie 0). */
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        min-height: 100dvh;
        max-width: 32rem;
        margin: 0 auto;
        padding: calc(1.5rem + env(safe-area-inset-top, 0px))
          calc(1.5rem + env(safe-area-inset-right, 0px))
          calc(1.5rem + env(safe-area-inset-bottom, 0px))
          calc(1.5rem + env(safe-area-inset-left, 0px));
      }
      .logo {
        display: block;
        width: 12rem;
        max-width: 100%;
        height: auto;
      }
      .logo-ink {
        color: var(--logo-ink);
      }
      .logo-blue {
        color: var(--logo-blue);
      }
      .logo-accent {
        color: var(--logo-accent);
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        padding: 3.5rem 1.5rem;
        border-radius: 0.875rem;
        background: var(--card);
        text-align: center;
        box-shadow:
          0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent),
          0 1px 3px 0 rgb(0 0 0 / 0.1);
      }
      .symbol {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3.5rem;
        height: 3.5rem;
        margin-bottom: 0.5rem;
        border-radius: 9999px;
        background: color-mix(in oklch, var(--primary) 10%, transparent);
        color: var(--primary);
      }
      .symbol svg {
        width: 1.75rem;
        height: 1.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        text-wrap: balance;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: var(--muted-foreground);
      }
      .hint {
        font-size: 0.8125rem;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 2.25rem;
        margin-top: 0.75rem;
        padding: 0 0.875rem;
        border-radius: 0.5rem;
        background: var(--primary);
        color: var(--primary-foreground);
        font-size: 0.9375rem;
        font-weight: 600;
        text-decoration: none;
      }
      .button:hover {
        background: color-mix(in oklch, var(--primary) 85%, transparent);
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
