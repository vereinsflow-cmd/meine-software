<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>VereinsFlow Nacht</title>
<!--
  Spot „Nacht“ (60 s, 1080 × 1920) für TikTok und Instagram Reels – dunkel, mit Licht und 3D, nach dem Vorbild eines
  Marken-Spots: Logo mit Lichtstreifen → Flug durch das Logo, das Handy fliegt mit einer Drehung ein, Karten springen
  aus dem Bildschirm → Flug in den Bildschirm: Mitglied anlegen → Wisch: Beitragslauf → Kippen: Kalender, Flug ins
  Sommerfest → Zusage → Kamera über der Musterstadt, Sturz auf den Sportplatz → Helferplan → Wisch: Vereins-Chat →
  App-Symbol dreht sich ein → Vereinsfotos in Fenstern aus den Logo-Balken (Torjubel, Grillen, Feuer, Sommerfest) →
  Sätze → Logo mit Lichtschein.
  Kein Sprecher, nur Musik (werkzeuge/musik.mjs --nacht, Zeiten in werkzeuge/drehbuch-nacht.mjs).
  window.seek(t) zeichnet das Bild für die Sekunde t. werkzeuge/rendern.mjs --seite nacht mittelt jedes Bild aus
  mehreren Zeitpunkten (Bewegungsunschärfe wie bei einer Filmkamera; wie viele, sagt window.UNTERBILDER(t)).
  Vorschau ohne Unschärfe: nacht.html?play oder nacht.html?t=9. App-Bilder im Dunkelmodus: aufnehmen.mjs --dunkel.
-->
<style>
:root{
  --nacht:#060b16; --nacht2:#0a1324; --tinte:#0f1c2e; --blau:#3a6bea; --himmel:#8fb0ff; --signal:#ff8a5e; --gruen:#4ade80;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --ft:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
body.vorschau{display:grid;place-items:start center;background:#222;overflow:auto}
#film{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--nacht);font-family:var(--ft);color:#fff;-webkit-font-smoothing:antialiased}
#buehne{position:absolute;inset:0;transform-origin:50% 50%}
.szene{position:absolute;inset:0;overflow:hidden;display:none}
.abs{position:absolute}
.crop{position:absolute;overflow:hidden;background-repeat:no-repeat}

/* Grund: Nacht, Licht, Körnung, Blitz, Lichtstreifen, Funken */
.grund{position:absolute;inset:0;background:radial-gradient(1100px 900px at 50% 48%,rgba(58,107,234,.26),rgba(58,107,234,0) 70%),radial-gradient(900px 600px at 50% 104%,rgba(143,176,255,.12),rgba(0,0,0,0) 70%),var(--nacht)}
#korn{position:absolute;inset:0;background:url(marke/koernung.svg);opacity:.16;mix-blend-mode:screen;pointer-events:none;z-index:90}
#vignette{position:absolute;inset:0;background:radial-gradient(1250px 1750px at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%);pointer-events:none;z-index:89}
.funke{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(190,210,255,.9),rgba(143,176,255,0) 70%)}
#schwarz{position:absolute;inset:0;background:#000;z-index:95;opacity:0;pointer-events:none}
#blitz{position:absolute;inset:0;z-index:88;opacity:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(1000px 1400px at 50% 48%,rgba(255,255,255,.95),rgba(175,200,255,.62) 38%,rgba(58,107,234,.2) 72%,rgba(58,107,234,0))}
.streif{position:absolute;left:-260px;width:1600px;height:46px;margin-top:-23px;z-index:87;opacity:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(255,255,255,1),rgba(190,210,255,.75) 22%,rgba(90,140,255,.28) 55%,rgba(58,107,234,0))}
.streif::after{content:"";position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(160,190,255,.35) 40%,rgba(58,107,234,0))}
#spruehen{position:absolute;inset:0;z-index:55;pointer-events:none}
#spruehen i{position:absolute;left:0;top:0;display:block;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;opacity:0}

/* Überschriften: Wörter klappen nach oben auf, hervorgehobene Wörter mit Lichtlauf */
#titel{position:absolute;left:80px;right:60px;top:236px;z-index:60;font:800 86px/1.05 var(--f);letter-spacing:-.03em;color:#fff;filter:drop-shadow(0 6px 30px rgba(6,11,22,.85));perspective:1100px}
#titel .w{display:inline-block;white-space:pre;transform-origin:50% 100%}
#titel em,.satz em{font-style:normal;color:transparent;background:linear-gradient(90deg,var(--himmel) 0,var(--himmel) 2860px,#fff 3000px,var(--himmel) 3140px,var(--himmel) 6000px) 0 0/6000px 100% no-repeat;-webkit-background-clip:text;background-clip:text}
#titel.auf-foto{top:auto;bottom:400px;font-size:92px}
#titel.auf-foto em{background:none;color:#fff}
#titel.gross{font-size:124px}
#titel.gross .w{transform-origin:50% 60%}

/* 1 Logo */
#logo-box{position:absolute;left:160px;top:640px;width:760px;filter:drop-shadow(0 0 22px rgba(143,176,255,.5))}
#logo-box svg{width:100%;height:auto;overflow:visible}
.lg{transform-box:fill-box;transform-origin:center}
.kopf{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,210,1) 0%,rgba(255,138,94,.85) 22%,rgba(255,138,94,0) 70%);mix-blend-mode:screen}
.strahl{position:absolute;height:7px;border-radius:6px;background:linear-gradient(90deg,rgba(143,176,255,0),rgba(220,232,255,1),rgba(143,176,255,0));box-shadow:0 0 22px 6px rgba(143,176,255,.45)}

/* 3D-Raum und Telefon (Rahmen aus Metall, Rückseite mit Kamera, Spiegelung auf dem Glas) */
.raum{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 46%}
.welt{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d}
.handy{position:absolute;width:520px;height:1127px;transform-style:preserve-3d}
.handy .vorne,.handy .hinten{position:absolute;inset:0;border-radius:86px;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:linear-gradient(135deg,#6b7181 0%,#2a2d35 15%,#4a505d 33%,#1a1c22 57%,#565c6b 80%,#22252c 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.24),0 0 0 1px rgba(143,176,255,.22),0 0 110px rgba(58,107,234,.45),0 70px 140px rgba(0,0,0,.6)}
.handy .vorne{padding:14px}
.handy .vorne::before{content:"";position:absolute;inset:4px;border-radius:82px;background:#040405}
.handy .hinten{transform:rotateY(180deg)}
.handy .hinten::before{content:"";position:absolute;inset:4px;border-radius:82px;background:linear-gradient(160deg,#2c313b,#15171c 55%,#21252f)}
.handy .hinten img{position:absolute;left:175px;top:480px;width:170px;opacity:.9}
.handy .kamera{position:absolute;left:34px;top:34px;width:196px;height:196px;border-radius:58px;background:linear-gradient(150deg,#3a3f4b,#191b21);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 8px 20px rgba(0,0,0,.5)}
.handy .linse{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#5b74a8 0 8%,#141b2b 22%,#05070b 55%,#252932 58%,#0b0c10 72%);box-shadow:0 0 0 4px #2b2f38}
.handy .taste{position:absolute;width:8px;border-radius:4px;background:linear-gradient(90deg,#1d2026,#6a7080 55%,#2a2d35)}
.handy .scr{position:relative;width:100%;height:100%;border-radius:72px;overflow:hidden;background:#0a0a0b}
.handy .insel{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:134px;height:40px;border-radius:22px;background:#000;z-index:5}
.handy .status{position:absolute;left:0;right:0;top:0;height:58px;display:flex;justify-content:space-between;align-items:center;padding:8px 40px 0 64px;font:600 23px/1 var(--ft);color:#f2f2f2;background:#0a0a0b;z-index:4}
.handy .hvp{position:absolute;left:0;top:58px;width:390px;height:844px;transform-origin:0 0;transform:scale(1.2615)}
.handy .hvp img{position:absolute;left:0;top:0;width:390px}
.handy .spiegel{position:absolute;inset:0;z-index:7;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(112deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.1) 45%,rgba(255,255,255,.025) 52%,rgba(255,255,255,0) 60%);background-size:280% 100%;background-position:50% 0}
.glas{position:absolute;box-shadow:0 0 0 1.5px rgba(143,176,255,.28),0 0 60px rgba(58,107,234,.35),0 40px 90px rgba(0,0,0,.55)}
.karte-gross{position:absolute;box-shadow:0 0 0 2px rgba(143,176,255,.3),0 0 90px rgba(58,107,234,.45),0 50px 100px rgba(0,0,0,.6)}
.tipp{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid rgba(255,255,255,.9);background:rgba(143,176,255,.25);z-index:40}
.ring-gruen{position:absolute;border-radius:24px;box-shadow:0 0 0 4px rgba(74,222,128,.75),0 0 50px 12px rgba(74,222,128,.35)}
.ring-blau{position:absolute;border-radius:50%;box-shadow:0 0 0 4px rgba(143,176,255,.9),0 0 40px 10px rgba(143,176,255,.45)}
.fokus{position:absolute;border-radius:26px;box-shadow:0 0 0 3px rgba(143,176,255,.95),0 0 30px 6px rgba(58,107,234,.55);pointer-events:none}
.marke{position:absolute;width:5px;background:#8fb0ff;border-radius:3px}
.zahl{position:absolute;white-space:nowrap;font-variant-numeric:tabular-nums}
#karten,#b-schritte,#b-karten{position:absolute;inset:0;transform-style:preserve-3d}

/* Stadt */
.stadt{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 30%}
.boden{position:absolute;width:1400px;height:1400px;transform-style:preserve-3d;
  background:
    repeating-linear-gradient(0deg,rgba(143,176,255,.07) 0 2px,transparent 2px 70px),
    repeating-linear-gradient(90deg,rgba(143,176,255,.07) 0 2px,transparent 2px 70px),
    radial-gradient(700px 700px at 50% 50%,#0d1a33,#070d1a 75%)}
.strasse{position:absolute;background:#131d33;box-shadow:inset 0 0 0 1px rgba(143,176,255,.08)}
.haus{position:absolute;transform-style:preserve-3d}
.haus i{position:absolute;display:block}
.haus .dach{left:0;top:0;width:100%;height:100%;background:#1a2640;box-shadow:inset 0 0 0 1.5px rgba(143,176,255,.18)}
.haus .s{left:0;bottom:0;width:100%;transform-origin:50% 100%;background:linear-gradient(#152038,#0c1424)}
.haus .o{right:0;top:0;height:100%;transform-origin:100% 50%;background:linear-gradient(90deg,#101a2e,#0a1120)}
.platz{position:absolute;background:#0f3b26;box-shadow:inset 0 0 0 6px rgba(255,255,255,.35),0 0 60px rgba(74,222,128,.25)}
.platz::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:4px;margin-left:-2px;background:rgba(255,255,255,.35)}
.platz::after{content:"";position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.pin{position:absolute;width:0;height:0;transform-style:preserve-3d}
.pin .stehend{position:absolute;left:-36px;top:-150px;width:72px;height:150px;transform-origin:50% 100%}
.pin .kopf2{position:absolute;left:0;top:0;width:72px;height:72px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--signal);box-shadow:0 0 40px rgba(255,138,94,.9)}
.pin .kopf2::after{content:"";position:absolute;left:22px;top:22px;width:28px;height:28px;border-radius:50%;background:#fff}
.puls{position:absolute;border-radius:50%;border:5px solid rgba(255,138,94,.8)}
.status-karte{position:absolute;left:90px;right:90px;top:250px;border-radius:30px;padding:30px 36px 34px;background:rgba(14,22,40,.82);box-shadow:0 0 0 1.5px rgba(143,176,255,.25),0 30px 80px rgba(0,0,0,.5);z-index:20}
.status-karte h3{font:700 40px/1.1 var(--f)}
.status-karte p{font:500 26px/1.3 var(--ft);color:rgba(220,230,255,.7);margin-top:8px}
.schritte{display:flex;justify-content:space-between;margin-top:30px;position:relative}
.schritte::before{content:"";position:absolute;left:14px;right:14px;top:13px;height:4px;background:rgba(143,176,255,.2);border-radius:4px}
.schritte .bahn{position:absolute;left:14px;top:13px;height:4px;background:var(--signal);border-radius:4px;box-shadow:0 0 14px rgba(255,138,94,.8)}
.schritt{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;font:600 21px/1.1 var(--ft);color:rgba(220,230,255,.75);width:150px;text-align:center}
.schritt b{width:30px;height:30px;border-radius:50%;background:#1b2a48;box-shadow:inset 0 0 0 3px rgba(143,176,255,.35)}
.schritt.an b{background:var(--signal);box-shadow:0 0 16px rgba(255,138,94,.9)}

/* Chat */
.blase-neu{position:absolute;right:16px;max-width:300px;background:#005c4b;color:#e9edef;border-radius:14px 4px 14px 14px;padding:9px 12px 8px;font:400 15.5px/1.35 var(--ft);box-shadow:0 1px 1px rgba(0,0,0,.3);transform-origin:100% 100%}
.blase-neu small{display:block;text-align:right;font-size:11.5px;color:rgba(233,237,239,.65);margin-top:2px}
.blase-neu small b{color:#53bdeb;font-weight:600}
.blase-rein{position:absolute;left:16px;max-width:300px;background:#202c33;color:#e9edef;border-radius:4px 14px 14px 14px;padding:7px 12px 8px;font:400 15.5px/1.35 var(--ft);box-shadow:0 1px 1px rgba(0,0,0,.3);transform-origin:0 0}
.blase-rein strong{display:block;font:600 13.5px/1.3 var(--ft);color:#ff8a5e}
.blase-rein small{display:block;text-align:right;font-size:11.5px;color:rgba(233,237,239,.6);margin-top:2px}
.eingabe{position:absolute;font:400 16px/20px var(--ft);color:#e9edef;white-space:nowrap}
.eingabe .cursor{display:inline-block;width:2px;height:19px;margin-left:1px;vertical-align:-4px;background:#8fb0ff}

/* App-Symbol (Vorder- und Rückseite, dazwischen Schichten als Dicke) */
.symbol3d{position:absolute;left:310px;top:700px;width:460px;height:460px;transform-style:preserve-3d}
.symbol3d .lage{position:absolute;inset:0;border-radius:104px;background:#0a1224}
.symbol3d .vorne,.symbol3d .hinten{position:absolute;inset:0;border-radius:104px;background:linear-gradient(150deg,#1b2b4d 0%,#0f1c2e 45%,#070d1a 100%);box-shadow:inset 0 0 0 2px rgba(143,176,255,.35),inset 0 2px 30px rgba(143,176,255,.18);overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.symbol3d .hinten{transform:translateZ(-38px) rotateY(180deg)}
.symbol3d .vorne img,.symbol3d .hinten img{position:absolute;left:70px;top:58px;width:320px}
.symbol3d .hinten img{opacity:.5}
.glanz{position:absolute;inset:-40%;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 60%)}
.schatten{position:absolute;left:290px;top:1240px;width:500px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(58,107,234,.55),rgba(58,107,234,0))}
.aura{position:absolute;left:540px;top:930px;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;background:radial-gradient(closest-side,rgba(90,140,255,.5),rgba(58,107,234,.16) 45%,rgba(58,107,234,0));mix-blend-mode:screen;opacity:0}

/* Vereinsfotos in Fenstern in Form der Logo-Balken (schräge Parallelogramme) */
.fenster{position:absolute;background-repeat:no-repeat;filter:saturate(1.08) contrast(1.05)}
#fenster-rand polygon{fill:none;stroke:rgba(255,255,255,.9);stroke-width:4;stroke-linejoin:round;filter:drop-shadow(0 0 16px rgba(143,176,255,.95))}
.fp-punkt{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:var(--signal);box-shadow:0 0 40px rgba(255,138,94,.8);z-index:30}
.fp-strich{position:absolute;height:22px;margin-top:-11px;border-radius:11px;background:var(--signal);z-index:30}

/* Sätze und Schluss */
.satz{position:absolute;left:90px;right:60px;font:800 132px/1.04 var(--f);letter-spacing:-.035em;color:#fff}
.satz .w{display:inline-block;white-space:pre;transform-origin:0 60%}
.unterstrich{position:absolute;height:16px;border-radius:10px;background:var(--signal);box-shadow:0 0 24px rgba(255,138,94,.8);transform-origin:left center}
.kopflicht{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,244,236,1),rgba(255,138,94,.7) 35%,rgba(255,138,94,0));mix-blend-mode:screen;opacity:0}
.adresse{position:absolute;left:0;right:0;top:1180px;text-align:center;font:700 60px/1 var(--f);color:var(--himmel);letter-spacing:-.01em}
.demo{position:absolute;left:0;right:0;top:1270px;text-align:center;font:600 36px/1 var(--ft);color:rgba(230,236,255,.75)}
.schein{position:absolute;left:540px;top:1000px;width:1400px;height:260px;margin:-130px 0 0 -700px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(200,220,255,.55) 30%,rgba(58,107,234,.25) 60%,rgba(58,107,234,0));mix-blend-mode:screen}
</style>
</head>
<body>
<div id="film">
  <div class="grund"></div>
  <div id="funken"></div>

  <div id="buehne">
  <!-- 1 Logo mit Lichtstreifen -->
  <section class="szene" id="s-logo">
    <div class="strahl" id="strahl1" style="top:930px"></div>

const ecken = ([x, y, w, h, s]) => [[x, y], [x + w, y], [x + w + h * s, y + h], [x + h * s, y + h]];
const kasten = (pts) => {
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
};
/**
 * Fenster auf ein Parallelogramm setzen. Das Foto füllt das Bezugsfenster (wie „cover“, mit leichtem Zoom und Schwenk);
 * ist der Balken kleiner als der Bezug (schräges Wischen), bleibt das Foto stehen und nur der Ausschnitt wächst.
 */
function fenster(f, b, t, { zoom = 1.08, an = true, verlauf = 0, bezug = b } = {}) {
  if (!an) { f.el.style.display = "none"; f.rand.style.display = "none"; return; }
  const pts = ecken(b);
  const [x0, y0, w, h] = kasten(pts);
  const [rx, ry, rw, rh] = kasten(ecken(bezug));
  const s = Math.max(rw / f.W, rh / f.H) * zoom;
  const bw = f.W * s, bh = f.H * s;
  const bx = rx - x0 + (rw - bw) * clamp(f.px + Math.sin(t * 0.5 + f.ph) * 0.04), by = ry - y0 + (rh - bh) * f.py;
  Object.assign(f.el.style, {
    display: "block", left: x0 + "px", top: y0 + "px", width: w + "px", height: h + "px",
    backgroundImage: `linear-gradient(180deg,rgba(6,11,22,0) 50%,rgba(6,11,22,${verlauf}) 100%),url(${f.src})`,
    backgroundSize: `100% 100%,${bw}px ${bh}px`, backgroundPosition: `0 0,${bx}px ${by}px`,
    clipPath: `polygon(${pts.map((p) => `${p[0] - x0}px ${p[1] - y0}px`).join(",")})`,
  });
  f.rand.style.display = "block";
  f.rand.setAttribute("points", pts.map((p) => p.join(",")).join(" "));
}

function auftritt(key, t) {
  const [von, bis] = T[key];
  const a = AUFTRITT[key];
  let tr = "", o = 1;
  if (a.ein && t < von + a.ein[1]) {
    const [art, d] = a.ein;
    const p = P(t, von, d, E.expo);
    if (art === "tiefe") { tr += ` scale(${0.42 + 0.58 * p})`; o *= P(t, von, 0.1); }
    else if (art === "wisch") tr += ` perspective(1600px) translateX(${(1 - p) * 1300}px) rotateY(${-(1 - p) * 24}deg)`;
  }
  if (a.aus && t > bis - a.aus[1]) {
    const [art, d] = a.aus;
    const q = P(t, bis - d, d, E.inStark);
    if (art === "zoom") { tr += ` scale(${1 + 3.4 * q})`; o *= 1 - P(t, bis - d * 0.3, d * 0.3, E.lin); }
    else if (art === "wisch") tr += ` perspective(1600px) translateX(${-q * 1300}px) rotateY(${q * 24}deg)`;
    else if (art === "kipp") { tr += ` perspective(1600px) translateY(${-q * 420}px) rotateX(${q * 78}deg)`; o *= 1 - q * q; }
    else if (art === "sink") { tr += ` perspective(1600px) translateY(${q * 760}px) rotateX(${-q * 58}deg)`; o *= 1 - q * q; }
    else if (art === "weg") { tr += ` translateY(${-q * 560}px) scale(${1 - 0.78 * q})`; o *= 1 - q; }
  }
  return { tr: tr || "none", o, mitte: a.mitte ?? "540px 960px" };
}

}

function drawZusage(t) {
  const b = T.zusage[0];
  const w3 = $("#welt3");
  w3.style.transformOrigin = "540px 960px";
  w3.style.transform = `translateZ(${lerp(0, 90, P(t, b, 3, E.lin))}px) rotateX(${Math.sin((t - b) * 1.4) * 2}deg) rotateY(${Math.sin((t - b) * 1.1) * 3.5}deg)`;
  tipp(tippZ, t, b + 0.85, TIPP_Z[0], TIPP_Z[1]);
  const done = P(t, b + 0.9, 0.25, E.out);
  Z.vorher.style.opacity = 1 - done;
  Z.nachher.style.opacity = done;
  RING.style.opacity = P(t, b + 0.95, 0.3) * (1 - P(t, b + 2.1, 0.4));
  const zIn = P(t, b + 0.3, 0.5, E.back);
  const bump = 1 + 0.08 * Math.sin(clamp((t - (b + 1.05)) / 0.3) * Math.PI);
  for (const el of [Z.zahl1, Z.zahl2]) el.style.transform = `translateY(${(1 - zIn) * 80}px) scale(${bump})`;
  Z.zahl1.style.opacity = zIn * (1 - P(t, b + 1.05, 0.2));
  Z.zahl2.style.opacity = zIn * P(t, b + 1.05, 0.2);
  tf(Z.titel, `translateY(${(1 - P(t, b + 0.1, 0.6, E.expo)) * 50}px)`, P(t, b + 0.1, 0.3));
}

function drawStadt(t) {
  const b = T.stadt[0];
  const ein = P(t, b, 1.3, E.expo);
  const sturz = P(t, 28.05, 0.45, E.inStark); // Sturz auf den Sportplatz
  const rz = kf(t, [[b, -4], [b + 1.5, -30, E.out], [28.5, -46, E.inOut]]);
  const rx = lerp(lerp(24, 58, ein), 12, sturz);
  const s = lerp(0.62, 1, ein) * lerp(1, 1.12, P(t, b + 1.3, 2.75, E.inOut)) * (1 + 5.5 * sturz);
  const boden = $("#boden");
  boden.style.transform = `translateY(${(1 - ein) * 420}px) rotateX(${rx}deg) rotateZ(${rz}deg) scale(${s})`;
  boden.style.opacity = P(t, b, 0.2);
  for (const sp of SPUREN) {
    const q = P(t, sp.start, 1.1, E.inOut);
    for (const el of [sp.glow, sp.line]) {
      el.setAttribute("stroke-dasharray", `${sp.len} ${sp.len}`);
      el.setAttribute("stroke-dashoffset", String(sp.len * (1 - q)));
    }
    const [x, y] = punktAuf(sp.pts, sp.len * q);
    sp.punkt.setAttribute("cx", x);
    sp.punkt.setAttribute("cy", y);
    sp.punkt.style.opacity = q > 0 && q < 1 ? 1 : 0;
  }
  // Pin fällt herab, hüpft einmal, Wellen breiten sich aus
  const fall = P(t, b + 1.45, 0.38, E.in);
  const land = b + 1.83;
  const hupf = t > land ? Math.max(0, Math.sin(((t - land) / 0.24) * Math.PI) * Math.exp(-(t - land) / 0.13) * 34) : 0;
  const pin = $("#pin-steh");
  pin.style.transform = `rotateZ(${-rz}deg) rotateX(${-rx}deg) translateY(${-(1 - fall) * 560 - hupf}px)`;
  pin.style.opacity = P(t, b + 1.45, 0.06);
  for (let i = 0; i < 2; i++) {
    const ph = ((((t - land - i * 0.55) % 1.1) + 1.1) % 1.1) / 1.1;
    const r = 30 + 170 * ph;
    Object.assign($("#puls" + i).style, { left: PLATZ.x - r + "px", top: PLATZ.y - r + "px", width: r * 2 + "px", height: r * 2 + "px", opacity: t > land + i * 0.55 ? 0.9 * (1 - ph) : 0 });
  }
  const k = P(t, b + 0.3, 0.75, E.expo);
  tf($("#status"), `translateY(${(1 - k) * -280 - sturz * 560}px) scale(${0.94 + 0.06 * k})`, P(t, b + 0.3, 0.2) * (1 - sturz));
  const fort = kf(t, [[b + 0.7, 0], [b + 1.8, 1 / 3, E.inOut], [b + 2.6, 2 / 3, E.inOut], [b + 3.4, 1, E.inOut]]);
  $("#bahn").style.width = `calc((100% - 28px) * ${fort})`;
  ["#st2", "#st3", "#st4"].forEach((s, i) => $(s).classList.toggle("an", fort >= (i + 1) / 3 - 0.001));
}

function drawHelfer(t) {
  const b = T.helfer[0];
  const ein = P(t, b, 0.9, E.expo);
  const ry = kf(t, [[b, -16], [b + 5, 8, E.inOut]]);
  // Kamera fährt zum Antippen an den Knopf heran und wieder zurück
  const zt = kf(t, [[b + 2.25, 0], [b + 2.62, 1, E.inOut], [b + 3.7, 1], [b + 4.45, 0, E.inOut]]);
  const zs = 1 + 0.22 * zt;
  const c = [540, 1083];
  const wh = $("#welt-h");
  wh.style.transformOrigin = `${c[0]}px ${c[1]}px`;
  wh.style.transform = `translate(${(c[0] - H_TIPP[0]) * (zs - 1)}px,${(c[1] - H_TIPP[1]) * (zs - 1) + Math.sin((t - b) * 1.7) * 9 * (1 - zt)}px) scale(${zs}) rotateY(${ry * (1 - 0.7 * zt)}deg)`;
  $("#handy-h").style.transform = `translateZ(${-(1 - ein) * 260}px) rotateX(${(1 - ein) * 42}deg)`;
  spiegel(SPIEGEL.h, ry * (1 - 0.7 * zt), t);
  const scroll = kf(t, [[b + 0.55, 300], [b + 2.1, H_SCROLL, E.inOut]]);
  const nach = t >= b + 2.65;
  $("#h-vorher").style.visibility = nach ? "hidden" : "visible";
  $("#h-nachher").style.visibility = nach ? "visible" : "hidden";
  for (const id of ["#h-vorher", "#h-nachher"]) $(id).style.transform = `translateY(${-scroll}px)`;
  tipp($("#tipp-h"), t, b + 2.5, H_TIPP[0], H_TIPP[1]);
  $("#h-leuchten").style.opacity = P(t, b + 2.7, 0.3) * (1 - P(t, b + 4.3, 0.5));
}

function drawChat(t) {
  const b = T.chat[0];
  const ry = kf(t, [[b, -12], [b + 4, 6, E.inOut]]);
  // Kamera rückt an das Gespräch heran, sobald gesendet wird
  const zt = kf(t, [[b + 1.95, 0], [b + 2.7, 1, E.inOut]]);
  const zs = 1 + 0.12 * zt;
  const c = [560, 1083], p = [560, 980];
  const wc = $("#welt-c");
  wc.style.transformOrigin = `${c[0]}px ${c[1]}px`;
  wc.style.transform = `translate(${(c[0] - p[0]) * (zs - 1)}px,${(c[1] - p[1]) * (zs - 1) + Math.sin((t - b) * 1.6) * 8}px) scale(${zs}) rotateY(${ry}deg)`;
  $("#handy-c").style.transform = `rotateY(${-(1 - P(t, b, 0.9, E.expo)) * 32}deg)`;
  spiegel(SPIEGEL.c, ry - (1 - P(t, b, 0.9, E.expo)) * 32, t);
  const q = P(t, b + 0.45, 0.85, E.expo);
  tf($("#c-karte"), `translate3d(${(1 - q) * 260}px,${(1 - q) * -120}px,0px) rotateY(${lerp(0, 22, q)}deg) scale(${lerp(0.5, 1, q)})`, P(t, b + 0.45, 0.15));
  const zeichen = [..."Wer bringt den Grill mit? 🔥"];
  const n = Math.round(clamp((t - (b + 1.1)) / 0.9) * zeichen.length);
  const tippt = t > b + 1.0 && t < b + 2.05; // Feld hat den Fokus: Platzhalter weg, Text und blinkende Marke
  $("#c-leer").style.visibility = tippt ? "visible" : "hidden";
  $("#c-eingabe").innerHTML = tippt ? `${zeichen.slice(0, n).join("")}<span class="cursor" style="opacity:${Math.floor(t * 6) % 2 === 0 ? 1 : 0.3}"></span>` : "";
  tipp($("#tipp-c"), t, b + 2.0, C_SENDEN[0], C_SENDEN[1]);
  // Die Nachricht fliegt aus dem Eingabefeld nach oben in den Verlauf
  const q2 = P(t, b + 2.08, 0.5, E.expo);
  tf($("#c-neu"), `translateY(${(1 - q2) * 420}px) scale(${0.6 + 0.4 * q2})`, P(t, b + 2.08, 0.08));
  pop($("#c-antwort"), t, b + 2.85, { d: 0.4, dy: 30, s0: 0.8 });
}

function drawSymbol(t) {
  const b = T.symbol[0];
  const p = P(t, b, 1.5, E.expo); // zweieinhalb Drehungen aus der Tiefe, dann ruhig
  const ruhe = P(t, b + 1.0, 0.9, E.inOut);
  const ry = lerp(-900, 20, p) + Math.sin((t - b) * 1.3) * 7 * ruhe;
  const rx = lerp(40, 12, p) + Math.sin((t - b) * 1.1) * 3 * ruhe;
  const y = Math.sin((t - b) * 1.5) * 14 * ruhe + (1 - p) * 160;
  $("#symbol3d").style.transform = `translate3d(0px,${y}px,${lerp(-2000, 0, p)}px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  $("#glanz").style.transform = `translateX(${lerp(-60, 60, P(t, b + 1.35, 1.1, E.inOut))}%)`;
  const landen = t >= b + 1.0 ? Math.exp(-(t - (b + 1.0)) / 0.5) : 0;
  $("#aura").style.opacity = P(t, b + 0.3, 0.6) * (0.45 + 0.55 * landen);
  $("#schatten").style.opacity = 0.9 * p;
  $("#schatten").style.transform = `scale(${0.9 + 0.08 * Math.sin(t * 1.5)})`;
}

function drawGefuehl(t) {
  const a = T.gefuehl[0];
  const auf = [0, 1, 2].map((i) => P(t, a + i * 0.12, 0.85, E.expo)); // drei Balken öffnen sich aus der Mitte
  const zweite = P(t, 43.5, 0.75, E.expo); // Torjubel und Feuer fliegen hinaus, das Grillen wächst
  const wisch = P(t, 45.0, 0.55, E.expo); // der Abend am Feuer wischt schräg über das Grillen
  const raus = P(t, 46.5, 0.5, E.inStark); // das große Fenster fliegt nach links hinaus …
  const fest = P(t, 46.5, 0.6, E.expo); // … das Sommerfest kommt von rechts …
  const voll = P(t, 48.0, 0.55, E.expo); // … und füllt das ganze Bild
  const zoom = 1.06 + 0.06 * P(t, a, 9, E.lin);
  // solange die drei Fenster offen stehen, schweben sie leicht gegeneinander
  const schweben = (b, i) => [b[0] + Math.sin((t - a) * 0.9 + i * 1.7) * 16 * (1 - zweite), b[1] + Math.cos((t - a) * 0.7 + i) * 7 * (1 - zweite), b[2], b[3], b[4]];
  const b1 = schweben(lb(lb(BALKEN.start[0], BALKEN.offen[0], auf[0]), BALKEN.zweite[0], zweite), 0);
  const b2 = lb(schweben(lb(lb(BALKEN.start[1], BALKEN.offen[1], auf[1]), BALKEN.zweite[1], zweite), 1), BALKEN.grillWeg, raus);
  const b3 = schweben(lb(lb(BALKEN.start[2], BALKEN.offen[2], auf[2]), BALKEN.zweite[2], zweite), 2);
  fenster(FE.tor, b1, t, { zoom, an: zweite < 1 });
  fenster(FE.grill, b2, t, { zoom, an: raus < 1 && wisch < 1 });
  if (wisch > 0) fenster(FE.feuer, [b2[0] + b2[2] * (1 - wisch), b2[1], b2[2] * wisch, b2[3], b2[4]], t, { zoom, an: raus < 1, bezug: b2 });
  else fenster(FE.feuer, b3, t, { zoom, an: zweite < 1 });
  fenster(FE.fest, lb(lb(BALKEN.fest[0], BALKEN.fest[1], fest), BALKEN.fest[2], voll), t, { zoom: 1.04 + 0.05 * P(t, 46.5, 3, E.lin), an: t >= 46.5, verlauf: 0.8 });
  // Orangener Punkt mit Strichen wie im Logo: unter den drei Fenstern, später neben „Mehr Verein.“
  const k = t < 46.5 ? P(t, 41.0, 0.45, E.back) * (1 - P(t, 43.5, 0.3, E.in)) : P(t, 48.1, 0.45, E.back);
  const [px, py] = t < 46.5 ? [420, 1790] : [880, 1830];
  Object.assign($("#fp-punkt").style, { left: px + "px", top: py + "px", transform: `scale(${k})`, opacity: k > 0 ? 1 : 0 });
  Object.assign($("#fp-strich1").style, { left: px - 46 - 116 + "px", top: py + "px", transform: `scaleX(${k})`, transformOrigin: "100% 50%", opacity: k > 0 ? 1 : 0 });
  Object.assign($("#fp-strich2").style, { left: px - 46 - 176 + "px", top: py + "px", transform: `scaleX(${k})`, transformOrigin: "100% 50%", opacity: k > 0 ? 1 : 0 });
}

function drawSaetze(t) {
  const b = T.saetze[0];
  // Wörter schlagen auf den Takt ein und fliegen dann nach oben weg
  [...$("#satz1").querySelectorAll(".w")].forEach((w, i) => {
    const a = b + i * 0.5;
    const p = P(t, a, 0.38, E.expo);
    const weg = P(t, b + 1.27 + i * 0.04, 0.24, E.inStark);
    w.style.transform = `translateY(${-weg * 1500}px) scale(${1 + 1.6 * (1 - p)})`;
    w.style.opacity = P(t, a, 0.05) * (1 - P(t, b + 1.4 + i * 0.04, 0.11, E.lin));
  });
  const s2 = $("#satz2");
  s2.style.opacity = t >= b + 1.6 ? 1 : 0;
  const [w1, w2] = s2.querySelectorAll(".w");
  w1.style.transform = `translateX(${(1 - P(t, b + 1.6, 0.45, E.expo)) * -1150}px)`;
  tf(w2, `scale(${1 + 1.3 * (1 - P(t, b + 1.9, 0.4, E.expo))})`, P(t, b + 1.9, 0.05));
  w2.querySelector("em").style.backgroundPosition = `${lerp(-300, 900, P(t, b + 2.2, 0.8, E.inOut)) - 3000 - w2.offsetLeft}px 0`;
  const u = P(t, b + 2.05, 0.45, E.inOut);
  $("#unterstrich").style.transform = `scaleX(${u})`;
  $("#unterstrich").style.opacity = u > 0 ? 1 : 0;
  Object.assign($("#kopflicht").style, { left: 96 + 300 * u + "px", top: "1060px", opacity: u <= 0 ? 0 : u < 1 ? 1 : Math.max(0, 1 - (t - (b + 2.5)) / 0.3) });
}

function drawEnde(t) {
  const b = T.ende[0];
  const p = P(t, b, 0.65, E.expo);
  const zug = lerp(1, 1.05, P(t, b + 0.6, DAUER - b - 0.6, E.lin)); // ganz langsam näher bis zum Schluss
  tf($("#end-logo"), `scale(${(1 + 1.3 * (1 - p)) * zug})`, P(t, b, 0.06));
  tf($("#adresse"), `translateY(${(1 - P(t, b + 0.45, 0.6, E.expo)) * 50}px) scale(${zug})`, P(t, b + 0.45, 0.25));
  tf($("#demo"), `translateY(${(1 - P(t, b + 0.65, 0.6, E.expo)) * 50}px) scale(${zug})`, P(t, b + 0.65, 0.25));
  const fl = b + 3.4;
  const s = P(t, fl, 1.4, E.out);
  const glut = kf(t, [[fl, 0], [fl + 0.6, 1, E.out], [fl + 2.2, 0.85], [DAUER - 0.1, 0, E.in]]);
  $("#schein").style.transform = `scaleX(${0.05 + 0.95 * s}) scaleY(${0.25 + 0.2 * s})`;
  $("#schein").style.opacity = glut;
}

function drawTitel(t) {
  const el = $("#titel");
  const cur = TITEL.find((x) => t >= x.von && t < x.bis);
  if (!cur) { el.style.visibility = "hidden"; return; }
  el.style.visibility = "visible";
  if (el.dataset.key !== String(cur.von)) {
    el.dataset.key = String(cur.von);
    el.className = cur.cls ?? "";
    const tmp = document.createElement("div");
    tmp.innerHTML = cur.html;
    let out = "";
    for (const node of tmp.childNodes) {
      if (node.nodeName === "BR") { out += "<br>"; continue; }
      for (const w of node.textContent.split(" ").filter(Boolean)) out += node.nodeType === 1 ? `<span class="w"><em>${w} </em></span>` : `<span class="w">${w} </span>`;
    }
    el.innerHTML = out;
  }
  const ws = [...el.querySelectorAll(".w")];
  // „Schlag“: die ganze Zeile fällt groß ins Bild (von links verankert), sonst klappt Wort für Wort auf
  el.style.transformOrigin = "0% 50%";
  el.style.transform = cur.stil === "schlag" ? `scale(${1 + 1.4 * (1 - P(t, cur.von, 0.42, E.expo))})` : "none";
  ws.forEach((w, i) => {
    const a = cur.von + i * 0.055;
    let tr, o;
    if (cur.stil === "schlag") {
      tr = "translateY(0px)";
      o = P(t, cur.von, 0.06);
    } else {
      // Wort klappt von unten nach oben auf
      const p = P(t, a, 0.6, E.expo);
      tr = `translateY(${(1 - p) * 70}px) rotateX(${-(1 - p) * 95}deg)`;
      o = P(t, a, 0.14);
    }
    const aus = cur.bis - 0.2 - (ws.length - 1 - i) * 0.03; // alle Wörter sind beim Ende weg
    if (t > aus) {
      const k = P(t, aus, 0.2, E.in);
      tr += ` translateY(${-k * 60}px) rotateX(${k * 85}deg)`;
      o *= 1 - k;
    }
    tf(w, tr, o);
  });
  const x = lerp(-400, 1400, P(t, cur.von + 0.6, 1.0, E.inOut));
  for (const em of el.querySelectorAll("em")) em.style.backgroundPosition = `${x - 3000 - em.parentElement.offsetLeft}px 0`;
}

function drawFunken(t) {
  for (const f of FUNKEN) {
    const y = (((f.y - t * f.v) % 1920) + 1920) % 1920;
    const x = f.x + Math.sin(t * 0.7 + f.ph) * 20;
    f.el.style.transform = `translate(${x}px,${y}px)`;
    f.el.style.opacity = f.a * (0.6 + 0.4 * Math.sin(t * 2 + f.ph));
  }
}

const SZENEN = [
  ["#s-logo", "logo", drawLogo],
  ["#s-handy", "handy", drawHandy],
  ["#s-mitglieder", "mitglieder", drawMitglieder],
  ["#s-beitraege", "beitraege", drawBeitraege],
  ["#s-termine", "termine", drawTermine],
  ["#s-zusage", "zusage", drawZusage],
  ["#s-stadt", "stadt", drawStadt],
  ["#s-helfer", "helfer", drawHelfer],
  ["#s-chat", "chat", drawChat],
  ["#s-symbol", "symbol", drawSymbol],
  ["#s-gefuehl", "gefuehl", drawGefuehl],
  ["#s-saetze", "saetze", drawSaetze],
  ["#s-ende", "ende", drawEnde],
].map(([sel, key, draw]) => ({ el: $(sel), key, von: T[key][0], bis: key === "ende" ? DAUER + 0.01 : T[key][1], draw }));

function render(t) {
  for (const s of SZENEN) {
    const on = t >= s.von && t < s.bis;
    s.el.style.display = on ? "block" : "none";
    if (!on) continue;
    s.draw(t);
    const a = auftritt(s.key, t);
    Object.assign(s.el.style, { transformOrigin: a.mitte, transform: a.tr, opacity: a.o });
  }
  $("#buehne").style.transform = `scale(${1 + stossWert(t)})`;
  $("#blitz").style.opacity = blitzWert(t);
  drawStreifen(t);
  drawRegen(t);
  drawFunken(t);
  drawTitel(t);
  $("#schwarz").style.opacity = Math.max(1 - P(t, 0, 0.35), P(t, DAUER - 0.4, 0.4));
}

const ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((img) => (img.complete ? img.decode().catch(() => {}) : new Promise((r) => { img.onload = img.onerror = r; }))));
  const urls = new Set(Object.values(FENSTER_BILD).map((f) => f.src));
  for (const el of document.querySelectorAll(".crop")) {
    const m = /url\("?([^")]+)"?\)/.exec(getComputedStyle(el).backgroundImage);
    if (m) urls.add(m[1]);
  }
  await Promise.all([...urls].map((u) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
})();
window.DAUER = DAUER;
window.seek = async (t) => {
  await ready;
  render(t);
  await new Promise((r) => requestAnimationFrame(() => r()));
};
const params = new URLSearchParams(location.search);
if (params.has("play") || params.has("t")) {
  document.body.classList.add("vorschau");
  ready.then(() => {
    if (params.has("t")) render(Number(params.get("t")));
    else {
      const t0 = performance.now() - Number(params.get("play") || 0) * 1000;
      const loop = () => { render(((performance.now() - t0) / 1000) % DAUER); requestAnimationFrame(loop); };
      loop();
    }
  });
}
</script>
