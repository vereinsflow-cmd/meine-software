<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>VereinsFlow Kurzspot</title>
<!--
  Kurzspot „Nacht“ (22,5 s, 1080 × 1920) für TikTok und Instagram Reels – dunkel, mit Licht und 3D, nach dem Vorbild
  eines Marken-Spots: Logo mit Lichtstreifen → Handy mit schwebenden Karten → Zusage → Stadtkarte mit Leuchtspuren →
  App-Symbol in 3D → „Alles in einem Flow.“ → Logo mit Lichtschein. Kein Sprecher, nur Musik (werkzeuge/musik-nacht.mjs).
  window.seek(t) zeichnet das Bild für die Sekunde t (werkzeuge/rendern.mjs --seite nacht). Vorschau: nacht.html?play
  oder nacht.html?t=9. App-Bilder im Dunkelmodus: werkzeuge/aufnehmen.mjs --dunkel.
-->
<style>
:root{
  --nacht:#060b16; --nacht2:#0a1324; --tinte:#0f1c2e; --blau:#3a6bea; --himmel:#8fb0ff; --signal:#ff8a5e;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --ft:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
body.vorschau{display:grid;place-items:start center;background:#222;overflow:auto}
#film{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--nacht);font-family:var(--ft);color:#fff;-webkit-font-smoothing:antialiased}
.szene{position:absolute;inset:0;overflow:hidden;display:none}
.abs{position:absolute}
.crop{position:absolute;overflow:hidden;background-repeat:no-repeat}

/* Grund: Nacht, Licht, Körnung */
.grund{position:absolute;inset:0;background:radial-gradient(1100px 900px at 50% 48%,rgba(58,107,234,.26),rgba(58,107,234,0) 70%),radial-gradient(900px 600px at 50% 104%,rgba(143,176,255,.12),rgba(0,0,0,0) 70%),var(--nacht)}
#korn{position:absolute;inset:0;background:url(marke/koernung.svg);opacity:.16;mix-blend-mode:screen;pointer-events:none;z-index:90}
#vignette{position:absolute;inset:0;background:radial-gradient(1250px 1750px at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%);pointer-events:none;z-index:89}
.funke{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(190,210,255,.9),rgba(143,176,255,0) 70%)}
#schwarz{position:absolute;inset:0;background:#000;z-index:95;opacity:0;pointer-events:none}

/* 1 Logo */
#logo-box{position:absolute;left:160px;top:640px;width:760px;filter:drop-shadow(0 0 22px rgba(143,176,255,.5))}
#logo-box svg{width:100%;height:auto;overflow:visible}
.lg{transform-box:fill-box;transform-origin:center}
.kopf{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,230,210,1) 0%,rgba(255,138,94,.85) 22%,rgba(255,138,94,0) 70%);mix-blend-mode:screen}
.strahl{position:absolute;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(143,176,255,0),rgba(200,220,255,.95),rgba(143,176,255,0));filter:blur(1px)}

/* 3D-Raum */
.raum{position:absolute;inset:0;perspective:1900px;perspective-origin:50% 46%}
.welt{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d}
.handy{position:absolute;width:520px;height:1127px;border-radius:84px;background:#0b0b0f;padding:14px;box-shadow:inset 0 0 0 3px #2c2f38,0 0 0 1.5px rgba(143,176,255,.35),0 0 90px rgba(58,107,234,.55),0 60px 120px rgba(0,0,0,.6)}
.handy .scr{position:relative;width:100%;height:100%;border-radius:70px;overflow:hidden;background:#0a0a0c}
.handy .insel{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:134px;height:40px;border-radius:22px;background:#000;z-index:5}
.handy .status{position:absolute;left:0;right:0;top:0;height:58px;display:flex;justify-content:space-between;align-items:center;padding:6px 46px 0 58px;font:600 23px/1 var(--ft);color:#f2f2f2;background:#0a0a0c;z-index:4}
.handy .hvp{position:absolute;left:0;top:58px;width:390px;height:844px;transform-origin:0 0}
.handy .hvp img{position:absolute;left:0;top:0;width:390px;height:844px}
.glas{position:absolute;box-shadow:0 0 0 1.5px rgba(143,176,255,.28),0 0 60px rgba(58,107,234,.35),0 40px 90px rgba(0,0,0,.55)}
.licht-kante{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.18) 48%,rgba(255,255,255,0) 60%);mix-blend-mode:screen}

/* 3 Zusage */
.karte-gross{position:absolute;border-radius:32px;box-shadow:0 0 0 2px rgba(143,176,255,.3),0 0 90px rgba(58,107,234,.45),0 50px 100px rgba(0,0,0,.6)}
.tipp{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid rgba(255,255,255,.9);background:rgba(143,176,255,.25)}
.ring-gruen{position:absolute;border-radius:24px;box-shadow:0 0 0 4px rgba(74,222,128,.75),0 0 50px 12px rgba(74,222,128,.35)}

/* 4 Stadt */
.stadt{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 30%}
.boden{position:absolute;left:-160px;top:420px;width:1400px;height:1400px;transform-style:preserve-3d;transform-origin:50% 50%;
  background:
    repeating-linear-gradient(0deg,rgba(143,176,255,.07) 0 2px,transparent 2px 70px),
    repeating-linear-gradient(90deg,rgba(143,176,255,.07) 0 2px,transparent 2px 70px),
    radial-gradient(700px 700px at 50% 50%,#0d1a33,#070d1a 75%)}
.strasse{position:absolute;background:#131d33;box-shadow:inset 0 0 0 1px rgba(143,176,255,.08)}
.haus{position:absolute;transform-style:preserve-3d}
.haus i{position:absolute;display:block}
.haus .dach{left:0;top:0;width:100%;height:100%;background:#1a2640;box-shadow:inset 0 0 0 1.5px rgba(143,176,255,.18)}
.haus .s{left:0;bottom:0;width:100%;transform-origin:50% 100%;background:linear-gradient(#152038,#0c1424)}
.haus .o{right:0;top:0;height:100%;transform-origin:100% 50%;background:linear-gradient(90deg,#101a2e,#0a1120)}
.platz{position:absolute;background:#0f3b26;box-shadow:inset 0 0 0 6px rgba(255,255,255,.35),0 0 60px rgba(74,222,128,.25)}
.platz::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:4px;margin-left:-2px;background:rgba(255,255,255,.35)}
.platz::after{content:"";position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.pin{position:absolute;width:0;height:0;transform-style:preserve-3d}
.pin .stehend{position:absolute;left:-36px;top:-150px;width:72px;height:150px;transform-origin:50% 100%}
.pin .kopf2{position:absolute;left:0;top:0;width:72px;height:72px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--signal);box-shadow:0 0 40px rgba(255,138,94,.9)}
.pin .kopf2::after{content:"";position:absolute;left:22px;top:22px;width:28px;height:28px;border-radius:50%;background:#fff}
.puls{position:absolute;border-radius:50%;border:5px solid rgba(255,138,94,.8)}
.status-karte{position:absolute;left:90px;right:90px;top:250px;border-radius:30px;padding:30px 36px 34px;background:rgba(14,22,40,.82);box-shadow:0 0 0 1.5px rgba(143,176,255,.25),0 30px 80px rgba(0,0,0,.5);z-index:20}
.status-karte h3{font:700 40px/1.1 var(--f)}
.status-karte p{font:500 26px/1.3 var(--ft);color:rgba(220,230,255,.7);margin-top:8px}
.schritte{display:flex;justify-content:space-between;margin-top:30px;position:relative}
.schritte::before{content:"";position:absolute;left:14px;right:14px;top:13px;height:4px;background:rgba(143,176,255,.2);border-radius:4px}
.schritte .bahn{position:absolute;left:14px;top:13px;height:4px;background:var(--signal);border-radius:4px;box-shadow:0 0 14px rgba(255,138,94,.8)}
.schritt{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;font:600 21px/1.1 var(--ft);color:rgba(220,230,255,.75);width:150px;text-align:center}
.schritt b{width:30px;height:30px;border-radius:50%;background:#1b2a48;box-shadow:inset 0 0 0 3px rgba(143,176,255,.35)}
.schritt.an b{background:var(--signal);box-shadow:0 0 16px rgba(255,138,94,.9)}

/* 5 App-Symbol */
.symbol3d{position:absolute;left:310px;top:700px;width:460px;height:460px;transform-style:preserve-3d}
.symbol3d .lage{position:absolute;inset:0;border-radius:104px;background:#0a1224}
.symbol3d .vorne{position:absolute;inset:0;border-radius:104px;background:linear-gradient(150deg,#1b2b4d 0%,#0f1c2e 45%,#070d1a 100%);box-shadow:inset 0 0 0 2px rgba(143,176,255,.35),inset 0 2px 30px rgba(143,176,255,.18);overflow:hidden}
.symbol3d .vorne img{position:absolute;left:70px;top:58px;width:320px}
.glanz{position:absolute;inset:-40%;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.22) 50%,rgba(255,255,255,0) 60%)}
.schatten{position:absolute;left:290px;top:1240px;width:500px;height:90px;border-radius:50%;background:radial-gradient(closest-side,rgba(58,107,234,.55),rgba(58,107,234,0))}

/* 6 Sätze */
.satz{position:absolute;left:90px;right:60px;font:800 132px/1.04 var(--f);letter-spacing:-.035em;color:#fff}
.satz .w{display:inline-block;white-space:pre}
.satz em{font-style:normal;color:var(--himmel)}
.unterstrich{position:absolute;height:16px;border-radius:10px;background:var(--signal);box-shadow:0 0 24px rgba(255,138,94,.8);transform-origin:left center}

/* 7/8 Schluss */
.adresse{position:absolute;left:0;right:0;top:1180px;text-align:center;font:700 60px/1 var(--f);color:var(--himmel);letter-spacing:-.01em}
.demo{position:absolute;left:0;right:0;top:1270px;text-align:center;font:600 36px/1 var(--ft);color:rgba(230,236,255,.75)}
.schein{position:absolute;left:540px;top:1000px;width:1400px;height:260px;margin:-130px 0 0 -700px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(200,220,255,.55) 30%,rgba(58,107,234,.25) 60%,rgba(58,107,234,0));mix-blend-mode:screen}
</style>
</head>

function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;

    for (let i = 0; i < 10; i++) { const e = sx(t) - x; if (Math.abs(e) < 1e-6) break; const d = dsx(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }

  };

}

  const fort = kf(t, [[8.6, 0], [9.6, 1 / 3, E.inOut], [10.2, 2 / 3, E.inOut], [10.8, 1, E.inOut]]);
  $("#bahn").style.width = `calc((100% - 28px) * ${fort})`;
  ["#st2", "#st3", "#st4"].forEach((s, i) => $(s).classList.toggle("an", fort >= (i + 1) / 3 - 0.001));
  $("#s-stadt").style.opacity = 1 - P(t, 10.85, 0.15);
}

function drawSymbol(t) {
  const ein = P(t, 11.0, 0.9, E.out);
  const ry = lerp(-150, 22, P(t, 11.0, 2.6, E.soft));
  const rx = 12 + Math.sin(t * 1.2) * 4;
  const y = Math.sin(t * 1.5) * 16 + (1 - ein) * 260;
  $("#symbol3d").style.transform = `translateY(${y}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${0.8 + 0.2 * ein})`;
  $("#symbol3d").style.opacity = P(t, 11.0, 0.25);
  $("#glanz").style.transform = `translateX(${lerp(-60, 60, P(t, 11.6, 1.6, E.inOut))}%)`;
  $("#schatten").style.opacity = 0.9 * ein;
  $("#schatten").style.transform = `scale(${0.9 + 0.08 * Math.sin(t * 1.5)})`;
  $("#s-symbol").style.opacity = 1 - P(t, 13.85, 0.15);
}

function pops(container, t, start, step) {
  [...container.querySelectorAll(".w")].forEach((w, i) => {
    const p = P(t, start + i * step, 0.4, E.back);
    w.style.transform = `translateY(${(1 - p) * 60}px) scale(${0.9 + 0.1 * p})`;
    w.style.opacity = P(t, start + i * step, 0.18);
  });
}
function drawSaetze(t) {
  const s1 = $("#satz1");
  pops(s1, t, 14.0, 0.5);
  const weg = P(t, 15.28, 0.22, E.in);
  tf(s1, `translateY(${-120 * weg}px)`, 1 - weg);
  const s2 = $("#satz2");
  s2.style.opacity = t >= 15.6 ? 1 : 0;
  pops(s2, t, 15.6, 0.3);
  const u = P(t, 16.05, 0.45, E.inOut);
  $("#unterstrich").style.transform = `scaleX(${u})`;
  $("#unterstrich").style.opacity = u > 0 ? 1 : 0;
  const aus = P(t, 16.8, 0.2, E.in);
  $("#s-saetze").style.opacity = 1 - aus;
  $("#s-saetze").style.transform = `scale(${1 + 0.15 * aus})`;
}

function drawEnde(t) {
  const p = P(t, 17.0, 0.6, E.back);
  tf($("#end-logo"), `translateY(${(1 - p) * 60}px) scale(${0.9 + 0.1 * p})`, P(t, 17.0, 0.3));
  tf($("#adresse"), `translateY(${(1 - P(t, 17.4, 0.5, E.out)) * 30}px)`, P(t, 17.4, 0.3));
  tf($("#demo"), `translateY(${(1 - P(t, 17.6, 0.5, E.out)) * 30}px)`, P(t, 17.6, 0.3));
  // Lichtschein: wächst aus einem Punkt zur Linie, verglüht
  const s = P(t, 19.4, 1.4, E.out);
  const glut = kf(t, [[19.4, 0], [20.0, 1, E.out], [21.6, 0.85], [22.4, 0, E.in]]);
  $("#schein").style.transform = `scaleX(${0.05 + 0.95 * s}) scaleY(${0.25 + 0.2 * s})`;
  $("#schein").style.opacity = glut;
  $("#schein").style.top = "1000px";
}

function drawFunken(t) {
  for (const f of FUNKEN) {
    const y = (((f.y - t * f.v) % 1920) + 1920) % 1920;
    const x = f.x + Math.sin(t * 0.7 + f.ph) * 20;
    f.el.style.transform = `translate(${x}px,${y}px)`;
    f.el.style.opacity = f.a * (0.6 + 0.4 * Math.sin(t * 2 + f.ph));
  }
}

const SZENEN = [
  { el: $("#s-logo"), von: 0, bis: 2.55, draw: drawLogo },
  { el: $("#s-handy"), von: 2.45, bis: 5.55, draw: drawHandy },
  { el: $("#s-zusage"), von: 5.45, bis: 8.05, draw: drawZusage },
  { el: $("#s-stadt"), von: 7.95, bis: 11.05, draw: drawStadt },
  { el: $("#s-symbol"), von: 10.95, bis: 14.05, draw: drawSymbol },
  { el: $("#s-saetze"), von: 13.95, bis: 17.05, draw: drawSaetze },
  { el: $("#s-ende"), von: 16.95, bis: 22.6, draw: drawEnde },
];
function render(t) {
  for (const s of SZENEN) {
    const on = t >= s.von && t < s.bis;
    s.el.style.display = on ? "block" : "none";
    if (on) s.draw(t);
  }
  drawFunken(t);
  // erstes und letztes Licht
  $("#schwarz").style.opacity = Math.max(1 - P(t, 0, 0.35), P(t, 22.1, 0.4));
}

const ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((img) => (img.complete ? img.decode().catch(() => {}) : new Promise((r) => { img.onload = img.onerror = r; }))));
  const urls = new Set();
  for (const el of document.querySelectorAll(".crop")) {
    const m = /url\("?([^")]+)"?\)/.exec(getComputedStyle(el).backgroundImage);
    if (m) urls.add(m[1]);
  }
  await Promise.all([...urls].map((u) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
})();
window.DAUER = DAUER;
window.seek = async (t) => {
  await ready;
  render(t);
  await new Promise((r) => requestAnimationFrame(() => r()));
};
const params = new URLSearchParams(location.search);
if (params.has("play") || params.has("t")) {
  document.body.classList.add("vorschau");
  ready.then(() => {
    if (params.has("t")) render(Number(params.get("t")));
    else {
      const t0 = performance.now() - Number(params.get("play") || 0) * 1000;
      const loop = () => { render(((performance.now() - t0) / 1000) % DAUER); requestAnimationFrame(loop); };
      loop();
    }
  });
}
</script>
</body>
</html>
