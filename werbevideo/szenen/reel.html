<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>VereinsFlow Reel</title>
<!--
  Reel (60 s, 1080 × 1920, 128 BPM) für TikTok und Instagram: ein einziger Kameraflug ohne Schnitt durch eine Welt aus
  echten App-Bildern im Dunkelmodus (keine Fotos).
  Flug durch das Logo → Tunnel aus Dashboard-Karten, 233 Mitglieder → Mitglied anlegen, die Karte dreht sich um →
  durch drei Tore des Beitragslaufs, 7.240,00 € → Tiefflug über den Kalender, Termine wachsen hoch, hinein ins
  Sommerfest → am Helferplan entlang nach unten, eintragen → durch den Vereins-Chat → Warp mit allen Bildschirmen →
  hinein ins Handy, zurück, Logo.
  Technik: #welt ist die ganze Welt in 3D; die Kamera (KAMERA, glatte Kurven) bewegt die Welt umgekehrt. Teile, die zu
  nah an die Kamera kommen oder zu weit weg sind, werden ausgeblendet.
  window.seek(t) zeichnet das Bild für die Sekunde t; werkzeuge/rendern.mjs --seite reel mittelt je Bild mehrere
  Zeitpunkte (Bewegungsunschärfe). Zeiten für Musik und Geräusche: werkzeuge/drehbuch-reel.mjs.
  Vorschau ohne Unschärfe: reel.html?play oder reel.html?t=9.
-->
<style>
:root{
  --nacht:#05080f; --blau:#3a6bea; --himmel:#8fb0ff; --signal:#ff8a5e; --gruen:#4ade80;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --ft:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
body.vorschau{display:grid;place-items:start center;background:#222;overflow:auto}
#film{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--nacht);font-family:var(--ft);color:#fff;-webkit-font-smoothing:antialiased}
.grund{position:absolute;inset:0;background:radial-gradient(1200px 1000px at 50% 50%,rgba(58,107,234,.24),rgba(58,107,234,0) 70%),radial-gradient(900px 700px at 50% 100%,rgba(143,176,255,.1),rgba(0,0,0,0) 70%),var(--nacht)}
.crop{position:absolute;overflow:hidden;background-repeat:no-repeat}
.abs{position:absolute}

/* 3D-Welt: die Kamera sitzt im Blickpunkt von .raum, #welt wird umgekehrt zur Kamera bewegt */
.raum{position:absolute;inset:0;perspective:1100px;perspective-origin:540px 960px;overflow:hidden}
#welt{position:absolute;left:540px;top:960px;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0}
.w{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.schirm{position:absolute;border-radius:36px;background-repeat:no-repeat;box-shadow:0 0 0 2px rgba(143,176,255,.45),0 0 90px rgba(58,107,234,.5)}
.karte{position:absolute;box-shadow:0 0 0 2px rgba(143,176,255,.4),0 0 90px rgba(58,107,234,.45),0 50px 100px rgba(0,0,0,.6)}
.staub{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,rgba(225,235,255,.95),rgba(143,176,255,.35) 40%,rgba(143,176,255,0) 70%)}
.balken{position:absolute}
.zaehler{position:absolute;border-radius:44px;background:linear-gradient(160deg,rgba(28,32,44,.96),rgba(12,14,20,.96));box-shadow:0 0 0 2px rgba(143,176,255,.45),0 0 110px rgba(58,107,234,.55);padding:56px 64px;font-family:var(--f)}
.zaehler small{display:block;font:600 52px/1 var(--ft);color:rgba(220,230,255,.7)}

.tor{position:absolute;border-radius:50%}
.tor-schild{position:absolute;display:flex;align-items:center;gap:30px;font:700 84px/1 var(--f);white-space:nowrap}
.tor-schild u{display:grid;place-items:center;width:110px;height:110px;border-radius:50%;text-decoration:none;font:800 70px/1 var(--f);color:#06210f}
.tor-schild em{display:block;font:600 52px/1.2 var(--ft);font-style:normal;color:var(--gruen)}
.chip{position:absolute;transform-origin:50% 100%}
.blase{position:absolute;border-radius:40px;padding:34px 44px 30px;font:400 56px/1.3 var(--ft);color:#e9edef;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 80px rgba(58,107,234,.35);white-space:nowrap}
.blase small{display:block;text-align:right;font-size:36px;color:rgba(233,237,239,.65);margin-top:6px}
.blase strong{display:block;font:600 46px/1.3 var(--ft);color:#ff8a5e}
.tipp{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:10px solid rgba(255,255,255,.92);background:rgba(143,176,255,.25)}
.ring-gruen{position:absolute;box-shadow:0 0 0 8px rgba(74,222,128,.85),0 0 90px 24px rgba(74,222,128,.4)}
.fokus{position:absolute;border-radius:26px;box-shadow:0 0 0 3px rgba(143,176,255,.95),0 0 30px 6px rgba(58,107,234,.55)}
.marke{position:absolute;width:5px;background:#8fb0ff;border-radius:3px}
.zahl{position:absolute;white-space:nowrap;font-variant-numeric:tabular-nums}
.ring-blau{position:absolute;border-radius:50%;box-shadow:0 0 0 4px rgba(143,176,255,.9),0 0 40px 10px rgba(143,176,255,.45)}

/* Telefon (Metallrahmen, Glas mit Spiegelung, Statusleiste) */
.handy{position:absolute;width:520px;height:1127px;transform-style:preserve-3d}
.handy .vorne{position:absolute;inset:0;border-radius:86px;padding:14px;background:linear-gradient(135deg,#6b7181 0%,#2a2d35 15%,#4a505d 33%,#1a1c22 57%,#565c6b 80%,#22252c 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.24),0 0 0 1px rgba(143,176,255,.22),0 0 110px rgba(58,107,234,.5),0 70px 140px rgba(0,0,0,.6)}
.handy .vorne::before{content:"";position:absolute;inset:4px;border-radius:82px;background:#040405}
.handy .taste{position:absolute;width:8px;border-radius:4px;background:linear-gradient(90deg,#1d2026,#6a7080 55%,#2a2d35)}
.handy .scr{position:relative;width:100%;height:100%;border-radius:72px;overflow:hidden;background:#0a0a0b}
.handy .insel{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:134px;height:40px;border-radius:22px;background:#000;z-index:5}
.handy .status{position:absolute;left:0;right:0;top:0;height:58px;display:flex;justify-content:space-between;align-items:center;padding:8px 40px 0 64px;font:600 23px/1 var(--ft);color:#f2f2f2;background:#0a0a0b;z-index:4}
.handy .hvp{position:absolute;left:0;top:58px;width:390px;height:844px;transform-origin:0 0;transform:scale(1.2615)}
.handy .hvp img{position:absolute;left:0;top:0;width:390px}
.handy .spiegel{position:absolute;inset:0;z-index:7;mix-blend-mode:screen;background:linear-gradient(112deg,rgba(255,255,255,0) 36%,rgba(255,255,255,.1) 45%,rgba(255,255,255,.025) 52%,rgba(255,255,255,0) 60%);background-size:280% 100%;background-position:50% 0}

/* Überlagerungen */
#tempo{position:absolute;left:0;top:0;z-index:50;mix-blend-mode:screen;pointer-events:none}
#titel{position:absolute;left:80px;right:60px;top:150px;z-index:60;font:800 88px/1.04 var(--f);letter-spacing:-.03em;color:#fff;filter:drop-shadow(0 6px 30px rgba(3,6,14,.95));perspective:1100px}
#titel .w2{display:inline-block;white-space:pre;transform-origin:50% 100%}
#titel em,#schlag em{font-style:normal;color:transparent;background:linear-gradient(90deg,var(--himmel) 0,var(--himmel) 2860px,#fff 3000px,var(--himmel) 3140px,var(--himmel) 6000px) 0 0/6000px 100% no-repeat;-webkit-background-clip:text;background-clip:text}
#schlag{position:absolute;left:70px;right:40px;top:760px;z-index:61;font:900 170px/1 var(--f);letter-spacing:-.045em;color:#fff;filter:drop-shadow(0 10px 40px rgba(3,6,14,.95));transform-origin:0 50%}
#schlag .zeile{display:block;white-space:nowrap}
#unterstrich{position:absolute;height:20px;border-radius:12px;background:var(--signal);box-shadow:0 0 30px rgba(255,138,94,.85);transform-origin:left center;z-index:61}
#ende{position:absolute;inset:0;z-index:62;pointer-events:none}
#ende img{position:absolute;left:220px;top:640px;width:640px;filter:drop-shadow(0 0 26px rgba(143,176,255,.5))}
#ende .adresse{position:absolute;left:0;right:0;top:1200px;text-align:center;font:700 64px/1 var(--f);color:var(--himmel)}
#ende .demo{position:absolute;left:0;right:0;top:1294px;text-align:center;font:600 38px/1 var(--ft);color:rgba(230,236,255,.78)}
.schein{position:absolute;left:540px;top:1020px;width:1500px;height:280px;margin:-140px 0 0 -750px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(200,220,255,.55) 30%,rgba(58,107,234,.25) 60%,rgba(58,107,234,0));mix-blend-mode:screen}
#blitz{position:absolute;inset:0;z-index:88;opacity:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(1000px 1400px at 50% 50%,rgba(255,255,255,.95),rgba(175,200,255,.62) 38%,rgba(58,107,234,.2) 72%,rgba(58,107,234,0))}
.streif{position:absolute;left:-260px;width:1600px;height:50px;margin-top:-25px;z-index:87;opacity:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(closest-side,rgba(255,255,255,1),rgba(190,210,255,.75) 22%,rgba(90,140,255,.28) 55%,rgba(58,107,234,0))}
.streif::after{content:"";position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(160,190,255,.35) 40%,rgba(58,107,234,0))}
#spruehen{position:absolute;inset:0;z-index:58;pointer-events:none}
#spruehen i{position:absolute;left:0;top:0;display:block;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;opacity:0}
#vignette{position:absolute;inset:0;background:radial-gradient(1250px 1750px at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.62) 100%);pointer-events:none;z-index:89}
#korn{position:absolute;inset:0;background:url(marke/koernung.svg);opacity:.15;mix-blend-mode:screen;pointer-events:none;z-index:90}
#schwarz{position:absolute;inset:0;background:#000;z-index:95;opacity:0;pointer-events:none}
</style>

<body>
<div id="film">
  <div class="grund"></div>
  <div class="raum"><div id="welt"></div></div>
  <svg id="tempo" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="spruehen"></div>
  <h2 id="titel"></h2>
  <div id="schlag"></div>
  <div id="unterstrich"></div>
  <div id="ende">
    <div class="schein" id="schein"></div>
    <img id="end-logo" src="marke/logo-gestapelt-weiss.svg" alt="">
    <div class="adresse" id="adresse">vereins-flow.com</div>
    <div class="demo" id="demo">Jetzt Demo anfragen</div>
  </div>
  <div class="streif" id="streif1"></div>
  <div class="streif" id="streif2"></div>

</div>

<script src="app/lage.js"></script>
<script>
"use strict";
const LAGE = window.LAGE;
const DAUER = 60;
const SCHLAG = 60 / 128, TAKT = 4 * SCHLAG; // 0,46875 s und 1,875 s
const AUGE = 1100; // Abstand des Blickpunkts (perspective)
const D2R = Math.PI / 180, TAU = Math.PI * 2;
const $ = (s) => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dsx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 10; i++) { const e = sx(t) - x; if (Math.abs(e) < 1e-6) break; const d = dsx(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
    return sy(clamp(t));
  };
}
const E = {
  lin: (x) => x,
  out: bezier(0.23, 1, 0.32, 1),
  expo: bezier(0.16, 1, 0.3, 1),
  inOut: bezier(0.77, 0, 0.175, 1),
  in: bezier(0.55, 0.055, 0.675, 0.19),
  inStark: bezier(0.7, 0, 0.84, 0),
  back: (x) => { const c1 = 1.4, c3 = c1 + 1; return x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spring: (x) => (x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(9 * x)),
};
const P = (t, a, d, e = E.out) => e(clamp((t - a) / d));
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e = E.inOut] = keys[i];
    const [t0, v0] = keys[i - 1];
    if (t <= t1) { const p = e((t - t0) / (t1 - t0 || 1)); return lerp(v0, v1, p); }
  }
  return keys[keys.length - 1][1];
}
/** Glatte Kurve durch Stützpunkte [t, Wert] (monotone kubische Hermite-Kurve: keine Überschwinger, Tempo ändert sich weich). */
function spur(keys) {
  const n = keys.length, ts = keys.map((k) => k[0]), vs = keys.map((k) => k[1]);
  const d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d[i] = (vs[i + 1] - vs[i]) / (ts[i + 1] - ts[i]);
  m[0] = d[0];
  m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const tau = 3 / Math.sqrt(s); m[i] = tau * a * d[i]; m[i + 1] = tau * b * d[i]; }
  }
  return (t) => {
    if (t <= ts[0]) return vs[0];
    if (t >= ts[n - 1]) return vs[n - 1];
    let i = 0;
    while (t > ts[i + 1]) i++;
    const h = ts[i + 1] - ts[i], s = (t - ts[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * vs[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * vs[i + 1] + (s3 - s2) * h * m[i + 1];
  };
}
function tf(el, s, o = 1) {
  el.style.transform = s;
  el.style.opacity = o;
}
function crop(parent, src, W, H, x, y, w, h, scale, { radius = 0, cls = "crop" } = {}) {
  const el = document.createElement("div");
  el.className = cls;
  Object.assign(el.style, {
    width: w * scale + "px", height: h * scale + "px", backgroundImage: `url(${src})`,
    backgroundSize: `${W * scale}px ${H * scale}px`, backgroundPosition: `${-x * scale}px ${-y * scale}px`, borderRadius: radius * scale + "px",
  });
  parent.appendChild(el);
  return el;
}
function at(el, x, y) {
  Object.assign(el.style, { left: x + "px", top: y + "px" });
  return el;
}
const rnd = (() => { let s = 11; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
function pop(el, t, a, { d = 0.45, dy = 50, s0 = 0.88, e = E.back } = {}) {
  const p = P(t, a, d, e);
  tf(el, `translateY(${(1 - p) * dy}px) scale(${s0 + (1 - s0) * p})`, P(t, a, d * 0.5, E.out));
}
function tipp(el, t, a) {
  const k = (t - a + 0.15) / 0.45;
  if (k < 0 || k > 1) { el.style.visibility = "hidden"; return; }
  el.style.visibility = "visible";
  el.style.transform = `scale(${k < 0.35 ? 1 - 0.25 * E.out(k / 0.35) : 0.75 + 0.5 * E.out((k - 0.35) / 0.65)})`;
  el.style.opacity = Math.min(1, k * 5, (1 - k) * 3);
}
const euro = (v) => v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";

// Abschnitte (wie in werkzeuge/drehbuch-reel.mjs), je ein Vielfaches eines Takts (1,875 s)
const T = {
  intro: [0, 3.75], dash: [3.75, 11.25], mitglieder: [11.25, 18.75], beitraege: [18.75, 26.25], termine: [26.25, 33.75],
  helfer: [33.75, 41.25], chat: [41.25, 46.875], warp: [46.875, 52.5], ende: [52.5, 60],
};

// ---------------------------------------------------------------------------------------------------------------
// Kamera: Position (x rechts, y unten, z zum Betrachter; vorwärts = z kleiner), Drehung in Grad
// ---------------------------------------------------------------------------------------------------------------
const H_Y = 3049; // Höhe des Wegs ab dem Helferplan
const KAMERA = {
  z: spur([
    [0, 2600], [1.5, 0], [2.6, -3500], [3.3, -6200], [3.75, -8000],
    [5.6, -11500], [7.5, -14800], [9.4, -18000], [11.25, -20900],
    [12.6, -22400], [15.2, -22480], [16.0, -22560], [16.6, -22660], [18.75, -25200],
    [19.6, -26000], [20.4, -27300], [21.2, -28600], [22.6, -29950], [24.8, -30100], [26.25, -33200],
    [27.6, -34600], [29.6, -35700], [31.4, -36500], [33.1, -37000], [33.75, -37650],
    [35.2, -39600], [37.7, -39640], [39.3, -39700], [40.4, -40500], [41.25, -41600],
    [43.1, -44200], [45.0, -46800], [46.875, -49500],
    [48.75, -53800], [50.6, -59500], [52.0, -62900], [52.5, -63350],
    [54.4, -60500], [60, -60300],
  ]),
  x: spur([
    [0, 0], [3.75, 0], [5.6, -280], [7.5, 300], [9.4, -220], [11.25, 0], [15.2, 0], [16.0, 220], [16.6, 140], [18.75, 0],
    [24.8, 0], [26.25, 260], [27.6, 0], [29.6, -200], [31.4, 430], [33.1, 597], [33.75, 600], [60, 600],
  ]),
  y: spur([
    [0, 0], [24.8, 0], [26.25, 60], [27.6, -90], [29.6, -40], [31.4, 120], [33.1, 150], [35.2, 150],
    [37.7, H_Y], [41.25, H_Y], [43.1, H_Y - 60], [45.0, H_Y + 80], [46.875, H_Y], [60, H_Y],
  ]),
  yaw: spur([
    [0, 0], [3.75, 0], [5.6, 7], [7.5, -8], [9.4, 6], [11.25, 0], [15.2, 0], [16.0, 9], [16.6, 5], [18.75, 0],
    [24.8, 0], [26.25, -6], [27.6, 0], [29.6, 4], [31.4, -10], [33.1, -2], [33.75, 0], [41.25, 0], [43.1, 6], [45.0, -7], [46.875, 0], [60, 0],
  ]),
  pitch: spur([
    [0, 0], [26.25, 0], [27.6, 16], [29.6, 18], [31.4, 9], [33.1, 0], [35.2, 0], [36.2, 8], [37.7, 0], [60, 0],
  ]),
  roll: spur([
    [0, 0], [2.4, 0], [3.75, -14], [5.6, 12], [7.5, -12], [9.4, 10], [11.25, 0], [18.75, 0], [19.6, 8], [21.2, -8], [22.6, 0],
    [31.4, 0], [33.1, 6], [33.75, 0], [41.25, 0], [43.1, -10], [45.0, 9], [46.875, 0], [48.0, 40], [50.6, 360], [52.5, 360], [60, 360],
  ]),
};
function kamera(t) {
  return { x: KAMERA.x(t), y: KAMERA.y(t), z: KAMERA.z(t), yaw: KAMERA.yaw(t), pitch: KAMERA.pitch(t), roll: KAMERA.roll(t) };
}
/** Weltpunkt → Kamerakoordinaten (z negativ = vor der Kamera). Gleiche Reihenfolge wie die Umkehr-Transformation von #welt. */
function inKamera(p, k) {
  let x = p[0] - k.x, y = p[1] - k.y, z = p[2] - k.z, a;
  a = -k.yaw * D2R; [x, z] = [x * Math.cos(a) + z * Math.sin(a), -x * Math.sin(a) + z * Math.cos(a)];
  a = -k.pitch * D2R; [y, z] = [y * Math.cos(a) - z * Math.sin(a), y * Math.sin(a) + z * Math.cos(a)];
  a = -k.roll * D2R; [x, y] = [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
  return [x, y, z];
}
function tempo(t) {
  const a = kamera(t - 0.02), b = kamera(t + 0.02);
  return Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z) / 0.04;

// ---------------------------------------------------------------------------------------------------------------
// Teile der Welt: jedes Teil hat einen Ankerpunkt; zu nahe, zu ferne oder zeitlich unpassende Teile werden ausgeblendet
// ---------------------------------------------------------------------------------------------------------------
const TEILE = [];
function teil({ p = [0, 0, 0], r = [0, 0, 0], s = 1, von = -1, bis = 99, immer = false, nah = 140, fern = 15000, kinder = false } = {}) {
  const el = document.createElement("div");
  el.className = "w";
  $("#welt").appendChild(el);
  const tl = { el, p, r, s, von, bis, immer, nah, fern, kinder, extra: "", alpha: 1, an: true };
  setze(tl);
  TEILE.push(tl);
  return tl;
}
function setze(tl) {
  tl.el.style.transform = `translate3d(${tl.p[0]}px,${tl.p[1]}px,${tl.p[2]}px) rotateY(${tl.r[0]}deg) rotateX(${tl.r[1]}deg) rotateZ(${tl.r[2]}deg) scale(${tl.s})${tl.extra}`;
}
function sichtbar(tl, t, k) {
  let o = tl.alpha;
  if (t < tl.von || t >= tl.bis) o = 0;
  else if (!tl.immer) {
    const d = -inKamera(tl.p, k)[2];
    o *= clamp((d - tl.nah) / 260) * clamp((tl.fern - d) / 3500);
  }
  if (o <= 0.002) {
    if (tl.an) { tl.el.style.display = "none"; tl.an = false; }
    return;
  }
  if (!tl.an) { tl.el.style.display = ""; tl.an = true; }
  if (tl.kinder) for (const c of tl.el.children) c.style.opacity = o;
  else tl.el.style.opacity = o;
}
/** Bild-Element mittig um den Anker; Ausschnitt [x, y, b, h] in CSS-Pixeln der Aufnahme (Breite W, Höhe H). */
function bild(tl, src, W, H, [x, y, w, h], scale, { radius = 16, cls = "crop karte" } = {}) {
  const el = crop(tl.el, src, W, H, x, y, w, h, scale, { radius, cls });
  at(el, (-w * scale) / 2, (-h * scale) / 2);
  return el;
}

function zeichneWelt(t) {
  // Logo setzt sich zusammen
  for (const b of LOGO) {
    const p = P(t, b.a, 1.15, E.expo);
    b.tl.p = b.ziel.map((v, i) => v + b.weg[i] * (1 - p));
    b.tl.alpha = P(t, b.a, 0.2);
    b.tl.extra = ` rotateZ(${(1 - p) * 70}deg)`;
    setze(b.tl);
  }
  // 233 zählt hoch, Karte dreht sich zur Kamera
  $("#z233").textContent = String(Math.round(233 * P(t, 4.4, 1.5, E.out)));
  Z233.r = [lerp(40, 14, P(t, 4.5, 3, E.out)), 0, 0];
  setze(Z233);
  // Mitglied anlegen
  {
    const b = 11.25;
    const fi = kf(t, [[b + 1.6, 0], [b + 2.08, 0], [b + 2.25, 1], [b + 2.58, 1], [b + 2.75, 2]]);
    const i0 = Math.min(2, Math.floor(fi)), i1 = Math.min(2, i0 + 1), fr = fi - i0;
    const r = M.feldLage[i0].map((v, j) => lerp(v, M.feldLage[i1][j], fr));
    Object.assign(M.fokus.style, { left: r[0] + "px", top: r[1] + "px", width: r[2] + "px", height: r[3] + "px", opacity: P(t, b + 1.5, 0.15) * (1 - P(t, b + 3.2, 0.15)) });
    for (const f of M.felder) {
      const k = clamp((t - f.t0) / f.d);
      const chars = Math.round(k * f.text.length);
      f.el.style.clipPath = `inset(0 ${Math.max(0, f.w - (14 + chars * 9.6) * MS)}px 0 0)`;
      f.el.style.opacity = t >= f.t0 ? 1 : 0;
      f.blank.style.opacity = t >= f.t0 - 0.05 ? 1 : 0;
      f.marke.style.opacity = t >= f.t0 - 0.05 && t < f.t0 + f.d + 0.1 ? (Math.floor(t * 6) % 2 === 0 ? 1 : 0.35) : 0;
      f.marke.style.transform = `translateX(${chars * 9.6 * MS}px)`;
    }
    pop(M.knopf, t, 14.55, { d: 0.45, dy: 40, s0: 0.85 });
    M.knopf.style.transform += ` scale(${1 - 0.07 * Math.sin(clamp((t - 14.95) / 0.25) * Math.PI)})`;
    tipp(M.tipp, t, 15.0);
    const dreh = P(t, 15.25, 0.75, E.inOut); // Karte dreht sich um: angelegt
    MK.extra = ` rotateY(${-180 * dreh}deg)`;
    MK.p = [0, Math.sin(t * 1.3) * 14, KARTE_Z];
    setze(MK);
    pop(M.meldung, t, 15.55, { d: 0.45, dy: -60, s0: 0.92 });
    pop(M.kopf, t, 15.63, { d: 0.45, dy: 50, s0: 0.94 });

  // Tore leuchten grün auf, kurz bevor die Kamera hindurchfliegt

    tor.schild.querySelector("u").style.background = g > 0.5 ? "#4ade80" : "#3a4a70";

    tor.schild.querySelector("em").style.opacity = g;

      c.tl.p = [c.start[0] + sx * 1600 * auf, c.start[1] + sy * 900 * auf, c.start[2] + 600 * auf];

    }

    setze(B.schritte);
  }
  // Termine wachsen als Welle vom nahen zum fernen Rand hoch, das Sommerfest steigt auf
  for (const c of CHIPS) {
    const a = 26.6 + (-37000 - c.boden[2]) / 2400 + (c.boden[0] + 3300) / 9000;
    const p = P(t, a, 0.55, E.back);
    if (c.fest) {

}

function zeichneTitel(t) {
  const el = $("#titel");
  const cur = TITEL.find((x) => t >= x.von && t < x.bis);
  if (!cur) { el.style.visibility = "hidden"; return; }
  el.style.visibility = "visible";
  if (el.dataset.key !== String(cur.von)) {
    el.dataset.key = String(cur.von);
    const tmp = document.createElement("div");
    tmp.innerHTML = cur.html;
    let out = "";
    for (const node of tmp.childNodes) {
      if (node.nodeName === "BR") { out += "<br>"; continue; }
      for (const w of node.textContent.split(" ").filter(Boolean)) out += node.nodeType === 1 ? `<span class="w2"><em>${w} </em></span>` : `<span class="w2">${w} </span>`;
    }
    el.innerHTML = out;
  }
  const ws = [...el.querySelectorAll(".w2")];
  ws.forEach((w, i) => {
    const p = P(t, cur.von + i * 0.055, 0.6, E.expo);
    let tr = `translateY(${(1 - p) * 70}px) rotateX(${-(1 - p) * 95}deg)`;
    let o = P(t, cur.von + i * 0.055, 0.14);
    const aus = cur.bis - 0.2 - (ws.length - 1 - i) * 0.03;
    if (t > aus) { const k = P(t, aus, 0.2, E.in); tr += ` translateY(${-k * 60}px) rotateX(${k * 85}deg)`; o *= 1 - k; }
    tf(w, tr, o);
  });
  const x = lerp(-400, 1400, P(t, cur.von + 0.6, 1.0, E.inOut));
  for (const em of el.querySelectorAll("em")) em.style.backgroundPosition = `${x - 3000 - em.parentElement.offsetLeft}px 0`;
}

function zeichneSchlag(t) {
  const el = $("#schlag"), u = $("#unterstrich");
  const cur = SCHLAEGE.find((x) => t >= x.von && t < x.bis);
  if (!cur) { el.style.visibility = "hidden"; u.style.opacity = 0; return; }
  el.style.visibility = "visible";
  if (el.dataset.key !== String(cur.von)) {
    el.dataset.key = String(cur.von);
    el.innerHTML = cur.zeilen.map((z) => `<span class="zeile">${z}</span>`).join("");
  }
  const p = P(t, cur.von, cur.strich ? 0.5 : 0.32, E.expo);
  const raus = cur.strich ? P(t, cur.bis - 0.25, 0.25, E.inStark) : 0;
  el.style.transform = `scale(${(1 + 1.4 * (1 - p)) * (1 + 2.2 * raus)})`;
  el.style.opacity = P(t, cur.von, 0.05) * (1 - raus);
  if (cur.strich) {
    const em = el.querySelector("em");
    em.style.backgroundPosition = `${lerp(-300, 900, P(t, cur.von + 0.6, 0.8, E.inOut)) - 3000}px 0`;
    const s = P(t, cur.von + 0.45, 0.45, E.inOut);
    Object.assign(u.style, { left: "76px", top: "1120px", width: "360px", transform: `scaleX(${s})`, opacity: s > 0 ? 1 - raus : 0 });
  } else u.style.opacity = 0;
}

function zeichneEnde(t) {
  const a = 55.3125;
  $("#ende").style.display = t >= a ? "block" : "none";
  if (t < a) return;
  const p = P(t, a, 0.65, E.expo);
  const zug = lerp(1, 1.05, P(t, a + 0.6, DAUER - a - 0.6, E.lin));
  tf($("#end-logo"), `scale(${(1 + 1.3 * (1 - p)) * zug})`, P(t, a, 0.06));
  tf($("#adresse"), `translateY(${(1 - P(t, a + 0.45, 0.6, E.expo)) * 50}px) scale(${zug})`, P(t, a + 0.45, 0.25));
  tf($("#demo"), `translateY(${(1 - P(t, a + 0.65, 0.6, E.expo)) * 50}px) scale(${zug})`, P(t, a + 0.65, 0.25));
  const fl = 56.25;
  const s = P(t, fl, 1.4, E.out);
  $("#schein").style.transform = `scaleX(${0.05 + 0.95 * s}) scaleY(${0.25 + 0.2 * s})`;
  $("#schein").style.opacity = kf(t, [[fl, 0], [fl + 0.6, 1, E.out], [fl + 2.2, 0.85], [DAUER - 0.1, 0, E.in]]);
}

function zeichneEffekte(t) {
  let blitz = 0;
  for (const [h, a] of BLITZE) { const k = t - h; if (k > -0.05 && k < 0.7) blitz += a * (k < 0 ? 1 + k / 0.05 : Math.exp(-k / 0.12)); }
  $("#blitz").style.opacity = Math.min(1, blitz);
  let stoss = 0;
  for (const [h, a] of STOESSE) { const k = t - h; if (k >= 0 && k < 0.7) stoss += a * Math.exp(-k / 0.11); }
  $(".raum").style.transform = `scale(${1 + stoss})`;
  const aktiv = STREIFEN.filter(([h]) => t >= h - 0.04 && t < h + 0.8).slice(-2);
  [$("#streif1"), $("#streif2")].forEach((el, i) => {
    const s = aktiv[i];
    if (!s) { el.style.opacity = 0; return; }
    const [h, y, a] = s, k = t - h;
    el.style.top = y + "px";
    el.style.opacity = a * (k < 0 ? 1 + k / 0.04 : Math.exp(-k / 0.2));
    el.style.transform = `scaleX(${0.35 + 0.85 * E.out(clamp((k + 0.04) / 0.35))}) scaleY(${1 - 0.5 * clamp(k / 0.6)})`;
  });
  for (const r of REGEN) {
    const k = t - r.t0, an = k >= 0 && k < 0.9;
    for (const p of r.teile) {
      if (!an) { p.el.style.opacity = 0; continue; }
      p.el.style.transform = `translate(${r.x + p.vx * k}px,${r.y + p.vy * k + 760 * k * k}px) scale(${p.s * (1 - (0.55 * k) / 0.9)})`;
      p.el.style.opacity = Math.pow(1 - k / 0.9, 1.4);
    }
  }
  // Tempo-Linien
  const v = tempo(t), st = clamp((v - 900) / 3800) * (t < 55.3 ? 1 : 0);
  for (const L of LINIEN) {
    const lauf = (L.ph + t * (0.6 + v / 4000)) % 1;
    const a = L.a + lauf * 700, b = a + L.len * (0.4 + st);
    L.l.setAttribute("x1", 540 + Math.cos(L.w) * a);
    L.l.setAttribute("y1", 960 + Math.sin(L.w) * a);
    L.l.setAttribute("x2", 540 + Math.cos(L.w) * b);
    L.l.setAttribute("y2", 960 + Math.sin(L.w) * b);
    L.l.setAttribute("stroke-opacity", String(st * 0.55 * Math.sin(lauf * Math.PI)));
  }
}

function render(t) {
  const k = kamera(t);
  zeichneWelt(t);
  $("#welt").style.transform = `translateZ(${AUGE}px) rotateZ(${-k.roll}deg) rotateX(${-k.pitch}deg) rotateY(${-k.yaw}deg) translate3d(${-k.x}px,${-k.y}px,${-k.z}px)`;
  for (const tl of TEILE) sichtbar(tl, t, k);
  zeichneTitel(t);
  zeichneSchlag(t);
  zeichneEnde(t);
  zeichneEffekte(t);
  $("#schwarz").style.opacity = Math.max(1 - P(t, 0, 0.35), P(t, DAUER - 0.4, 0.4));
}

const ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((img) => (img.complete ? img.decode().catch(() => {}) : new Promise((r) => { img.onload = img.onerror = r; }))));
  const urls = new Set();
  for (const el of document.querySelectorAll(".crop")) {
    const m = /url\("?([^")]+)"?\)/.exec(getComputedStyle(el).backgroundImage);
    if (m) urls.add(m[1]);
  }
  await Promise.all([...urls].map((u) => new Promise((r) => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
})();
window.DAUER = DAUER;
window.seek = async (t) => {
  await ready;
  render(t);
  await new Promise((r) => requestAnimationFrame(() => r()));
};
const params = new URLSearchParams(location.search);
if (params.has("play") || params.has("t")) {
  document.body.classList.add("vorschau");
  ready.then(() => {
    if (params.has("t")) render(Number(params.get("t")));
    else {
      const t0 = performance.now() - Number(params.get("play") || 0) * 1000;
      const loop = () => { render(((performance.now() - t0) / 1000) % DAUER); requestAnimationFrame(loop); };
      loop();
    }
  });
}
